name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare web files
        run: mkdir -p www resources && cp index.html www/ && cp icon.png splash.png resources/
      - name: Install and create Android project
        run: |
          npm install
          npx cap add android
          npx cap sync android
          npx capacitor-assets generate --android --iconBackgroundColor "#0b0d28" --splashBackgroundColor "#0b0d28"
      - name: Apply fixes
        run: |
          set -e
          cd android
          sed -i -E 's/(compileSdkVersion *= *)[0-9]+/\135/; s/(targetSdkVersion *= *)[0-9]+/\135/; s/(minSdkVersion *= *)[0-9]+/\124/' variables.gradle
          sed -i -E "s#(com.android.tools.build:gradle:)[0-9.]+#\18.7.3#" build.gradle
          sed -i -E 's#gradle-[0-9.]+-(all|bin)\.zip#gradle-8.9-all.zip#' gradle/wrapper/gradle-wrapper.properties
          grep -rl "proguard-android.txt" --include=build.gradle . ../node_modules/@capacitor ../node_modules/@capacitor-community 2>/dev/null | xargs -r sed -i "s/proguard-android.txt/proguard-android-optimize.txt/g"
          M=app/src/main/AndroidManifest.xml
          grep -q ads.APPLICATION_ID "$M" || sed -i 's#</application>#    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>\n    </application>#' "$M"
          grep -q "permission.INTERNET" "$M" || sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$M"
          grep -q "permission.AD_ID" "$M" || sed -i 's#<application#<uses-permission android:name="com.google.android.gms.permission.AD_ID"/>\n    <application#' "$M"
          grep -q "permission.VIBRATE" "$M" || sed -i 's#<application#<uses-permission android:name="android.permission.VIBRATE"/>\n    <application#' "$M"
          S=app/src/main/res/values/styles.xml
          grep -q windowOptOutEdgeToEdgeEnforcement "$S" || sed -i 's#<style name="AppTheme.NoActionBar"[^>]*>#&\n        <item name="android:windowOptOutEdgeToEdgeEnforcement">true</item>#' "$S"
          grep -n -A3 'AppTheme.NoActionBar"' "$S"
          J=$(find app/src/main/java -name MainActivity.java | head -1)
          PKG=$(grep -m1 '^package' "$J" | sed -E 's/package ([^;]+);/\1/')
          cat > "$J" <<JAVAEOF
          package $PKG;

          import android.graphics.Color;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.WindowManager;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
                  getWindow().getDecorView().setBackgroundColor(Color.parseColor("#04050F"));
                  if (Build.VERSION.SDK_INT >= 28) {
                      WindowManager.LayoutParams lp = getWindow().getAttributes();
                      lp.layoutInDisplayCutoutMode = Build.VERSION.SDK_INT >= 30
                          ? WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS
                          : WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                      getWindow().setAttributes(lp);
                  }
                  hideBars();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) hideBars();
              }

              private void hideBars() {
                  WindowInsetsControllerCompat c = WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
                  c.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                  c.hide(WindowInsetsCompat.Type.systemBars());
              }
          }
          JAVAEOF
          echo "MainActivity rewritten for immersive mode ($PKG)"
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: strip-night-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
