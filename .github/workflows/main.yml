name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare web files
        run: mkdir -p www resources && cp index.html www/ && cp icon.png splash.png resources/
      - name: Install and create Android project
        run: |
          npm install
          npx cap add android
          npx cap sync android
          npx capacitor-assets generate --android --iconBackgroundColor "#0b0d28" --splashBackgroundColor "#0b0d28"
      - name: Apply fixes
        run: |
          set -e
          cd android
          sed -i -E 's/(compileSdkVersion *= *)[0-9]+/\135/; s/(targetSdkVersion *= *)[0-9]+/\135/; s/(minSdkVersion *= *)[0-9]+/\124/' variables.gradle
          sed -i -E "s#(com.android.tools.build:gradle:)[0-9.]+#\18.7.3#" build.gradle
          sed -i -E 's#gradle-[0-9.]+-(all|bin)\.zip#gradle-8.9-all.zip#' gradle/wrapper/gradle-wrapper.properties
          grep -rl "proguard-android.txt" --include=build.gradle . ../node_modules/@capacitor ../node_modules/@capacitor-community 2>/dev/null | xargs -r sed -i "s/proguard-android.txt/proguard-android-optimize.txt/g"
          M=app/src/main/AndroidManifest.xml
          grep -q ads.APPLICATION_ID "$M" || sed -i 's#</application>#    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>\n    </application>#' "$M"
          grep -q "permission.INTERNET" "$M" || sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$M"
          grep -q "permission.AD_ID" "$M" || sed -i 's#<application#<uses-permission android:name="com.google.android.gms.permission.AD_ID"/>\n    <application#' "$M"
          S=app/src/main/res/values/styles.xml
          grep -q windowOptOutEdgeToEdgeEnforcement "$S" || sed -i 's#<style name="AppTheme.NoActionBar"[^>]*>#&\n        <item name="android:windowOptOutEdgeToEdgeEnforcement">true</item>#' "$S"
          grep -n -A3 'AppTheme.NoActionBar"' "$S"
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: strip-night-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
