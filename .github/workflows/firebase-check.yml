name: Firebase online check
on:
  workflow_dispatch:
  push:
    branches: [claude/firebase-live]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/firebase-check.mjs
